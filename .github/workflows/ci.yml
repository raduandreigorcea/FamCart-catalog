name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # NO NETWORK. Every test here runs off fixtures captured from the live
      # sites and committed, so a shop being slow, redesigned or simply down can
      # never turn this red. Re-capturing a fixture is how a redesign gets
      # noticed -- deliberately, by a person, not by a scheduled run reporting
      # zero products at 3am.
      - run: npm test

  schema:
    name: Schema tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      # `db start` restores from a local backup where one exists and SKIPS the
      # migrations. A cold runner has no backup so this job would get away with
      # it, but the same two commands are what a developer runs, where the backup
      # does exist and the suite then passes against a schema the migrations were
      # never applied to. `db reset` rebuilds unconditionally.
      - run: supabase db reset
      - run: supabase test db
