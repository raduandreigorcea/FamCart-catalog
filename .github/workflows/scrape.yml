name: Scrape

# Filling the catalog, on a schedule, from a machine nobody is using.
#
# WHY THIS EXISTS AT ALL. Scraping was a thing somebody ran on a laptop, which
# has two failure modes and both of them happened. A crawl that needs a live
# process for hours gets killed by whatever else the laptop is doing -- four
# times in one evening, at 1,500 and 2,500 pages -- and, worse, a catalog whose
# only refresh is manual has prices frozen on the day of the last run somebody
# remembered to start. Nothing errors. The data just quietly ages.
#
# This is a SEPARATE workflow from ci.yml on purpose, and CI still never
# scrapes: every test there runs off committed fixtures, so a shop being slow or
# redesigned cannot turn a build red. A redesign is meant to be noticed by a
# person re-capturing a fixture, not by a build going red at 3am.

on:
  schedule:
    # 01:20 UTC, nightly. Off the hour because everybody schedules on the hour
    # and GitHub's queue is correspondingly lumpy there.
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      retailer:
        description: 'Which shop (auchan, carrefour, lidl, all)'
        required: true
        default: all
      shard:
        description: 'Slice of the sitemap, as i/n. Carrefour only; blank for the whole shop.'
        required: false
        default: ''

# NEVER TWO AT ONCE. Two runs overlapping would double what every shop is asked
# to put up with, which is the one thing the transport layer is built to
# prevent -- and it would have both of them importing into the same catalog
# under different run rows. A queued run waits; it does not cancel the one in
# flight, because a cancelled crawl is a run that closes as failed and throws
# away hours of polite fetching.
concurrency:
  group: scrape
  cancel-in-progress: false

# Read-only. This workflow writes to Supabase and to nothing on GitHub.
permissions:
  contents: read

jobs:
  # ─── the two shops that fit in one job ──────────────────────────────────────
  # Auchan is a paged API -- 50 products per call, so ~60,000 products is about
  # 1,200 requests -- and Lidl is 511 pages. Both are done inside an hour, so
  # both crawl the whole shop, close as `completed`, and are allowed to sweep.
  # That is the only path by which anything is ever marked as no longer sold.
  full:
    name: ${{ matrix.retailer }}
    runs-on: ubuntu-latest
    strategy:
      # Sequential, not parallel. They are different hosts, so politeness does
      # not require it -- but one shop failing must not take the other down with
      # it, and two crawls writing at once is two run rows to read instead of
      # one. Lidl first because it is ten minutes: if the credentials are wrong,
      # that is when you find out.
      max-parallel: 1
      fail-fast: false
      matrix:
        retailer: [lidl, auchan]
    # Generous rather than tight: a job killed by a timeout leaves its run row
    # `running`, which the reaper in 007 has to clean up 12 hours later. The
    # crawls themselves are ~10 minutes and ~40.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The shop filter lives on the STEP, not on the job, and that is not a
      # style choice: a job-level `if` is evaluated before the matrix is
      # expanded, so `matrix.retailer` does not exist there yet. GitHub rejects
      # the whole FILE for it -- no name, no schedule, and a failed run against
      # whatever push happened to carry it. The workflow simply never runs, and
      # the only hint is that the Actions tab lists it by path instead of by
      # name.
      #
      # `github.event.inputs` rather than `inputs` for the same class of reason:
      # the `inputs` context exists only for workflow_dispatch and
      # workflow_call, so naming it in a workflow that also runs on a schedule
      # is another way to make the file unparseable. `github.event.inputs` is
      # defined everywhere and is simply empty when nobody filled a form in.
      - name: Scrape ${{ matrix.retailer }}
        if: >-
          github.event_name == 'schedule'
          || github.event.inputs.retailer == 'all'
          || github.event.inputs.retailer == matrix.retailer
        env:
          CATALOG_SUPABASE_URL: ${{ secrets.CATALOG_SUPABASE_URL }}
          CATALOG_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CATALOG_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape -- ${{ matrix.retailer }}

  # ─── the shop that does not fit ─────────────────────────────────────────────
  # Carrefour publishes 85,000 product pages and there is no API. At one request
  # a second -- which is the rate the shop is asked to tolerate, not a rate we
  # chose for convenience -- that is a full day, and a job here gets six hours.
  #
  # THE WAY OUT IS MORE NIGHTS, NOT PARALLEL JOBS. The ceiling is politeness, so
  # running the slices at once would simply mean several requests a second at
  # one shop: the same work, done rudely. Spread over nights, the shop sees
  # exactly the trickle it always did.
  #
  # FOURTEEN slices, and the number is measured rather than chosen. A live crawl
  # came back at 2.89 seconds a page -- the shop takes about 1.9 to hand over a
  # 300 KB page and the politeness gap was being added on top of that instead of
  # overlapping it. At the corrected pace a five-hour job covers about 9,500
  # pages, so 85,194 needs nine slices; fourteen leaves the margin the first
  # estimate did not have.
  #
  # It was five, from arithmetic that assumed a page arrives instantly. Each
  # slice then wanted 13.7 hours against a 5.5 hour cap, so every night was cut
  # off three quarters short and began the same slice again the next evening.
  # Coverage never advanced past the first fifth, and nothing reported a fault:
  # a truncated run closes as failed, which on this path is indistinguishable
  # from the shop having a bad night.
  #
  # A SLICE CAN NEVER SWEEP, and the CLI enforces that rather than trusting this
  # comment: it closes the run as `partial` -- neither a failure nor a success,
  # imported what it saw, no standing to say anything about the rest.
  #
  # The cost is real and worth stating plainly: on this path Carrefour products
  # are never marked unavailable, so a delisted one goes stale rather than
  # absent. `last_seen_at` is what tells those apart, and a full unsliced run
  # (dispatch by hand with the shard field blank, on a day you can spare the
  # 24 hours) is the only thing that would sweep.
  carrefour:
    name: carrefour
    if: >-
      github.event_name == 'schedule'
      || github.event.inputs.retailer == 'all'
      || github.event.inputs.retailer == 'carrefour'
    runs-on: ubuntu-latest
    # Under GitHub's six-hour ceiling with room to spare. A slice is ~6,100
    # pages, so a little over three hours at the MEASURED pace -- the margin is
    # deliberate this time, the previous number having been an estimate that
    # turned out to be a third of the truth.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # One slice a night, every night, cycling through all fourteen -- so a full
      # pass takes a fortnight.
      #
      # The index is days-since-epoch modulo 14 rather than the day of the week.
      # A weekday can only ever name five or seven slices, and the day of the
      # YEAR skips one every new year, since 365 is not a multiple of 14. Days
      # since epoch simply counts, so the cycle is exact and needs nothing
      # stored: no state to drift, and a missed night is one slice late rather
      # than an offset that never recovers.
      - name: Choose tonight's slice
        id: slice
        # The dispatch input arrives as an environment variable rather than
        # being pasted into the script. `${{ }}` is substituted before bash sees
        # the line, so an input containing a quote or a semicolon would be
        # running as part of this step rather than being read by it.
        env:
          SHARD: ${{ github.event.inputs.shard }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$SHARD" ]; then
            # Checked, not trusted. The value ends up inside a command line, and
            # a typo should fail here with a readable message rather than
            # further down as a scraper argument nobody recognises.
            case "$SHARD" in
              [1-9]/[1-9]|[1-9]/[1-9][0-9]|[1-9][0-9]/[1-9][0-9]) : ;;
              *) echo "shard must look like 1/14, got: $SHARD" >&2; exit 1 ;;
            esac
            echo "arg=--shard $SHARD" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "schedule" ]; then
            # A manual run with the field left blank means the whole shop, which
            # is the only run that may ever sweep. Deliberate, and slow.
            echo "arg=" >> "$GITHUB_OUTPUT"
          else
            # +1 because --shard is one-based: a person counting nights starts
            # at one, and 0/14 is not a slice.
            SLICE=$(( $(date -u +%s) / 86400 % 14 + 1 ))
            echo "tonight: slice $SLICE of 14"
            echo "arg=--shard $SLICE/14" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape carrefour
        env:
          CATALOG_SUPABASE_URL: ${{ secrets.CATALOG_SUPABASE_URL }}
          CATALOG_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CATALOG_SUPABASE_SERVICE_ROLE_KEY }}
          SLICE: ${{ steps.slice.outputs.arg }}
        # No `|| true`. A sliced run closes its run row as `partial` and exits
        # ZERO, because being one fifth of a shop is the expected outcome here
        # and a step that went red nightly would train everybody to ignore red.
        # Anything that does fail -- a circuit opening, bad credentials, the
        # shop going quiet -- still exits non-zero and still turns this red,
        # which is the whole point of not swallowing it.
        # $SLICE unquoted on purpose: it is either empty or the two words
        # `--shard 1/5`, and quoting it would hand the scraper one argument that
        # is an empty string when there is no slice.
        run: npm run scrape -- carrefour $SLICE
