name: Scrape

# Filling the catalog, on a schedule, from a machine nobody is using.
#
# WHY THIS EXISTS AT ALL. Scraping was a thing somebody ran on a laptop, which
# has two failure modes and both of them happened. A crawl that needs a live
# process for hours gets killed by whatever else the laptop is doing -- four
# times in one evening, at 1,500 and 2,500 pages -- and, worse, a catalog whose
# only refresh is manual has prices frozen on the day of the last run somebody
# remembered to start. Nothing errors. The data just quietly ages.
#
# This is a SEPARATE workflow from ci.yml on purpose, and CI still never
# scrapes: every test there runs off committed fixtures, so a shop being slow or
# redesigned cannot turn a build red. A redesign is meant to be noticed by a
# person re-capturing a fixture, not by a build going red at 3am.

on:
  schedule:
    # 01:20 UTC, nightly. Off the hour because everybody schedules on the hour
    # and GitHub's queue is correspondingly lumpy there.
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      retailer:
        description: 'Which shop (auchan, carrefour, lidl, mega-image, all)'
        required: true
        default: all

# NEVER TWO AT ONCE. Two runs overlapping would double what every shop is asked
# to put up with, which is the one thing the transport layer is built to
# prevent -- and it would have both of them importing into the same catalog
# under different run rows. A queued run waits; it does not cancel the one in
# flight, because a cancelled crawl is a run that closes as failed and throws
# away hours of polite fetching.
concurrency:
  group: scrape
  cancel-in-progress: false

# Read-only. This workflow writes to Supabase and to nothing on GitHub.
permissions:
  contents: read

jobs:
  # ─── all four, whole ────────────────────────────────────────────────────────
  # Auchan is a paged API -- 50 products per call, so ~60,000 products is about
  # 1,200 requests. Lidl is 511 pages. Carrefour reads department listings at
  # 24 products a request. Mega Image is 8,879 product pages, one request each,
  # and is the only one of the four whose sitemap dates its entries -- so after
  # the first full night it fetches what moved rather than all of them. All four
  # crawl the whole shop, and a run that closes as `completed` is allowed to
  # sweep -- which is the only path by which anything is ever marked as no longer
  # sold. Carrefour does not close that way yet; see the note at the end.
  full:
    name: ${{ matrix.retailer }}
    runs-on: ubuntu-latest
    strategy:
      # Sequential, not parallel. They are different hosts, so politeness does
      # not require it -- but one shop failing must not take the other down with
      # it, and two crawls writing at once is two run rows to read instead of
      # one. Lidl first because it is ten minutes: if the credentials are wrong,
      # that is when you find out.
      max-parallel: 1
      fail-fast: false
      matrix:
        retailer: [lidl, mega-image, auchan, carrefour]
    # Generous rather than tight: a job killed by a timeout leaves its run row
    # `running`, which the reaper in 007 has to clean up 12 hours later -- and
    # that reaper only runs when the NEXT run for some shop opens, so a stuck row
    # sits on the dashboard until then. Measured on 2026-09-15 the crawls take
    # ~4 minutes, ~4.5 hours and ~1 hour, and Carrefour about eight, which does
    # not fit.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The shop filter lives on the STEP, not on the job, and that is not a
      # style choice: a job-level `if` is evaluated before the matrix is
      # expanded, so `matrix.retailer` does not exist there yet. GitHub rejects
      # the whole FILE for it -- no name, no schedule, and a failed run against
      # whatever push happened to carry it. The workflow simply never runs, and
      # the only hint is that the Actions tab lists it by path instead of by
      # name.
      #
      # `github.event.inputs` rather than `inputs` for the same class of reason:
      # the `inputs` context exists only for workflow_dispatch and
      # workflow_call, so naming it in a workflow that also runs on a schedule
      # is another way to make the file unparseable. `github.event.inputs` is
      # defined everywhere and is simply empty when nobody filled a form in.
      - name: Scrape ${{ matrix.retailer }}
        if: >-
          github.event_name == 'schedule'
          || github.event.inputs.retailer == 'all'
          || github.event.inputs.retailer == matrix.retailer
        env:
          CATALOG_SUPABASE_URL: ${{ secrets.CATALOG_SUPABASE_URL }}
          CATALOG_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CATALOG_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape -- ${{ matrix.retailer }}

  # Carrefour used to live in its own job, cut into fourteen nightly slices,
  # because 85,119 product pages is about forty-five hours of polite fetching
  # against a six-hour ceiling. It reads department listings now -- twenty-four
  # products per request instead of one -- which was estimated at two hours and
  # measures about eight: the shop takes ~3.5 seconds a page, and 3,551
  # departments is more than one job. So Carrefour is killed at the limit every
  # night, and has never swept.
  #
  # What it does do every night is remove what is not groceries: it reads the
  # 545 grocery departments first, after which anything another department shows
  # is known to be outside groceries and is removed as it is read. A killed job
  # keeps every removal it made. The scraper also checks its own coverage
  # against the sitemap and refuses to conclude anything from absence if the
  # departments accounted for less than 95% of it.
